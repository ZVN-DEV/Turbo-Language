[workspace]
members = [
    "crates/turbo-lexer",
    "crates/turbo-ast",
    "crates/turbo-parser",
    "crates/turbo-formatter",
    "crates/turbo-codegen-cranelift",
    "crates/turbo-sema",
    "crates/turbo-cli",
    "crates/turbo-lsp",
]
default-members = [
    "crates/turbo-lexer",
    "crates/turbo-ast",
    "crates/turbo-parser",
    "crates/turbo-formatter",
    "crates/turbo-codegen-cranelift",
    "crates/turbo-sema",
    "crates/turbo-cli",
    "crates/turbo-lsp",
]
resolver = "2"

# Shared package metadata. Member crates opt in with
# `rust-version.workspace = true` so the MSRV is a single source of truth and
# is actually enforced by `cargo build` / clippy (which reads it via the
# `msrv` field in clippy.toml plus the package rust-version).
[workspace.package]
rust-version = "1.75"
description = "TurboLang compiler, runtime, CLI, and language tooling"
license = "MIT"
readme = "../README.md"
repository = "https://github.com/ZVN-DEV/Turbo-Language"
homepage = "https://turbolang.dev"

[workspace.dependencies]
logos = "0.14"
cranelift = "0.133"
cranelift-jit = "0.113"
cranelift-module = "0.113"
cranelift-codegen = { version = "0.113", features = ["all-arch"] }
cranelift-frontend = "0.113"
cranelift-native = "0.113"
cranelift-object = "0.113"
target-lexicon = "0.12"
ariadne = "0.4"
clap = { version = "4", features = ["derive"] }
notify = "7"
notify-debouncer-mini = "0.5"
ctrlc = "3"
libc = "0.2"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = true
strip = true

[profile.ci]
inherits = "dev"
overflow-checks = true
debug-assertions = true
