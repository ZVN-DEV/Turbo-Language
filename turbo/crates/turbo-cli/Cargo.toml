[package]
name = "turbo-cli"
version = "0.9.0"
edition = "2021"
rust-version.workspace = true
default-run = "turbolang"

[[bin]]
name = "turbolang"
path = "src/main.rs"

[dependencies]
turbo-lexer = { path = "../turbo-lexer" }
turbo-ast = { path = "../turbo-ast" }
turbo-parser = { path = "../turbo-parser" }
turbo-codegen-cranelift = { path = "../turbo-codegen-cranelift" }
turbo-sema = { path = "../turbo-sema" }
clap = { workspace = true }
ariadne = { workspace = true }
rustyline = "15"
notify = { workspace = true }
notify-debouncer-mini = { workspace = true }
ctrlc = { workspace = true }
libc = { workspace = true }
getrandom = "0.2"
tempfile = "3"

[features]
default = []
