[package]
name = "turbo-cli"
version = "0.10.3"
edition = "2021"
rust-version.workspace = true
description.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true
default-run = "turbolang"

[[bin]]
name = "turbolang"
path = "src/main.rs"

[dependencies]
turbo-lexer = { version = "0.10.3", path = "../turbo-lexer" }
turbo-ast = { version = "0.10.3", path = "../turbo-ast" }
turbo-parser = { version = "0.10.3", path = "../turbo-parser" }
turbo-formatter = { version = "0.10.3", path = "../turbo-formatter" }
turbo-codegen-cranelift = { version = "0.10.3", path = "../turbo-codegen-cranelift" }
turbo-sema = { version = "0.10.3", path = "../turbo-sema" }
clap = { workspace = true }
ariadne = { workspace = true }
rustyline = "15"
notify = { workspace = true }
notify-debouncer-mini = { workspace = true }
ctrlc = { workspace = true }
libc = { workspace = true }
getrandom = "0.2"
tempfile = "3"

[features]
default = []
