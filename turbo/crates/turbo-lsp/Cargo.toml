[package]
name = "turbo-lsp"
version = "0.14.0"
edition = "2021"
rust-version.workspace = true
description.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "turbo-lsp"
path = "src/main.rs"

[dependencies]
lsp-server = "0.7"
lsp-types = "0.97"
serde_json = "1"
turbo-lexer = { version = "0.14.0", path = "../turbo-lexer" }
turbo-parser = { version = "0.14.0", path = "../turbo-parser" }
turbo-formatter = { version = "0.14.0", path = "../turbo-formatter" }
turbo-sema = { version = "0.14.0", path = "../turbo-sema" }
turbo-ast = { version = "0.14.0", path = "../turbo-ast" }
