[package]
name = "turbo-lsp"
version = "0.7.0"
edition = "2021"
rust-version.workspace = true

[[bin]]
name = "turbo-lsp"
path = "src/main.rs"

[dependencies]
lsp-server = "0.7"
lsp-types = "0.97"
serde_json = "1"
turbo-lexer = { path = "../turbo-lexer" }
turbo-parser = { path = "../turbo-parser" }
turbo-sema = { path = "../turbo-sema" }
turbo-ast = { path = "../turbo-ast" }
