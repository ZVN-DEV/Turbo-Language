[package]
name = "turbo-fuzz"
version = "0.1.0"
edition = "2021"
publish = false

# Keep this crate out of the parent workspace
[workspace]

[dependencies]
turbo-lexer = { path = "../crates/turbo-lexer" }
turbo-parser = { path = "../crates/turbo-parser" }
turbo-sema = { path = "../crates/turbo-sema" }
turbo-ast = { path = "../crates/turbo-ast" }
turbo-codegen-cranelift = { path = "../crates/turbo-codegen-cranelift" }

# Default frontend fuzz binary (lex → parse → sema)
[[bin]]
name = "turbo-fuzz"
path = "src/main.rs"

# Codegen smoke fuzz binary (lex → parse → sema → JIT-compile)
[[bin]]
name = "codegen-fuzz"
path = "src/codegen_fuzz.rs"
