app = "turbolang-playground-runner"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = 5

[build]
  dockerfile = "website/playground-runner/Dockerfile"

[env]
  PORT = "8787"
  TURBO_PLAYGROUND_RUNNER_MAX_CONCURRENT = "2"
  TURBO_PLAYGROUND_RUNNER_TIMEOUT_MS = "5000"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 30

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
