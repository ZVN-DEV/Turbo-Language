name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: turbolang
            llvm_prefix: /opt/homebrew/opt/llvm@18
          - os: macos-13
            target: x86_64-apple-darwin
            artifact: turbolang
            llvm_prefix: /usr/local/opt/llvm@18
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: turbolang
            llvm_prefix: /usr/lib/llvm-18

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install LLVM 18 (macOS)
        if: runner.os == 'macOS'
        run: brew install llvm@18

      - name: Install LLVM 18 (Linux)
        if: runner.os == 'Linux'
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          sudo apt-get update
          sudo apt-get install -y llvm-18-dev libpolly-18-dev

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            turbo/target
          key: ${{ runner.os }}-cargo-release-${{ matrix.target }}-${{ hashFiles('turbo/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-${{ matrix.target }}-
            ${{ runner.os }}-cargo-release-

      - name: Build (Cranelift + LLVM)
        run: |
          cd turbo
          cargo build --release --target ${{ matrix.target }} -p turbo-cli --features turbo-cli/llvm
        env:
          LLVM_SYS_180_PREFIX: ${{ matrix.llvm_prefix }}

      - name: Build turbo-lsp
        run: |
          cd turbo
          cargo build --release --target ${{ matrix.target }} -p turbo-lsp

      - name: Smoke test
        if: matrix.target != 'x86_64-apple-darwin'
        run: ./turbo/target/${{ matrix.target }}/release/turbolang --version

      - name: Smoke test - compile and run (JIT)
        if: matrix.target != 'x86_64-apple-darwin'
        run: |
          echo 'fn main() { print("turbo works") }' > /tmp/test.tb
          ./turbo/target/${{ matrix.target }}/release/turbolang run /tmp/test.tb

      - name: Smoke test - LLVM AOT build
        if: matrix.target != 'x86_64-apple-darwin'
        run: |
          ./turbo/target/${{ matrix.target }}/release/turbolang build --llvm /tmp/test.tb -o /tmp/test_llvm
          /tmp/test_llvm

      - name: Package
        run: |
          cd turbo/target/${{ matrix.target }}/release
          tar czf turbolang-${{ github.ref_name }}-${{ matrix.target }}.tar.gz turbolang turbo-lsp

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: turbolang-${{ matrix.target }}
          path: turbo/target/${{ matrix.target }}/release/turbolang-*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4

      - name: Generate checksums
        run: |
          cd turbolang-aarch64-apple-darwin && sha256sum *.tar.gz >> ../checksums.txt && cd ..
          cd turbolang-x86_64-apple-darwin && sha256sum *.tar.gz >> ../checksums.txt && cd ..
          cd turbolang-x86_64-unknown-linux-gnu && sha256sum *.tar.gz >> ../checksums.txt && cd ..
          echo "Generated checksums:"
          cat checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            turbolang-aarch64-apple-darwin/*.tar.gz
            turbolang-x86_64-apple-darwin/*.tar.gz
            turbolang-x86_64-unknown-linux-gnu/*.tar.gz
            checksums.txt
          draft: false
          prerelease: false
