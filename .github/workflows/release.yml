name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: turbolang
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: turbolang
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: turbolang

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            turbo/target
          key: ${{ runner.os }}-cargo-release-${{ matrix.target }}-${{ hashFiles('turbo/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-${{ matrix.target }}-
            ${{ runner.os }}-cargo-release-

      - name: Build (Cranelift)
        run: |
          cd turbo
          cargo build --release --target ${{ matrix.target }} -p turbo-cli

      - name: Build turbo-lsp
        run: |
          cd turbo
          cargo build --release --target ${{ matrix.target }} -p turbo-lsp

      - name: Smoke test
        if: matrix.target != 'x86_64-apple-darwin'
        run: ./turbo/target/${{ matrix.target }}/release/turbolang --version

      - name: Smoke test - compile and run (JIT)
        if: matrix.target != 'x86_64-apple-darwin'
        run: |
          echo 'fn main() { print("turbo works") }' > /tmp/test.tb
          ./turbo/target/${{ matrix.target }}/release/turbolang run /tmp/test.tb

      - name: Smoke test - AOT build
        if: matrix.target != 'x86_64-apple-darwin'
        run: |
          ./turbo/target/${{ matrix.target }}/release/turbolang build /tmp/test.tb -o /tmp/test_aot
          /tmp/test_aot

      - name: Package
        run: |
          cd turbo/target/${{ matrix.target }}/release
          tar czf turbolang-${{ github.ref_name }}-${{ matrix.target }}.tar.gz turbolang turbo-lsp

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: turbolang-${{ matrix.target }}
          path: turbo/target/${{ matrix.target }}/release/turbolang-*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Check out the repo so we can pull the matching CHANGELOG section into the
      # GitHub release body (the release job otherwise only has the artifacts).
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1

      - name: Generate checksums
        run: |
          cd turbolang-aarch64-apple-darwin && sha256sum *.tar.gz >> ../checksums.txt && cd ..
          cd turbolang-x86_64-apple-darwin && sha256sum *.tar.gz >> ../checksums.txt && cd ..
          cd turbolang-x86_64-unknown-linux-gnu && sha256sum *.tar.gz >> ../checksums.txt && cd ..
          echo "Generated checksums:"
          cat checksums.txt

      # GitHub Actions forbids the `secrets` context in step-level `if:`
      # expressions, so we probe for each secret in a dedicated step and
      # expose its presence as a step output. Downstream steps then gate
      # on the output, which is allowed.
      - name: Probe release secrets
        id: probe-secrets
        env:
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${RELEASE_GPG_PRIVATE_KEY:-}" ]; then
            echo "has_gpg=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_gpg=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "${HOMEBREW_TAP_TOKEN:-}" ]; then
            echo "has_tap=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tap=false" >> "$GITHUB_OUTPUT"
          fi

      # Detached GPG signature for `checksums.txt`. Guarded so that forks
      # without the signing secrets simply skip this step instead of failing
      # the release. Verification path is documented in CONTRIBUTING.md
      # under "Release Verification".
      - name: Sign checksums.txt with release key
        if: steps.probe-secrets.outputs.has_gpg == 'true'
        env:
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail

          # Import the private key into a scratch GnuPG home so we don't
          # leak state into the runner's default home, and so the key
          # material is wiped at the end of the job.
          GNUPGHOME="$(mktemp -d)"
          export GNUPGHOME
          chmod 700 "${GNUPGHOME}"

          printf '%s' "${RELEASE_GPG_PRIVATE_KEY}" | gpg --batch --import

          # Use loopback pinentry so the passphrase env var is honored
          # in headless CI. `--yes` makes the sign step non-interactive
          # if a stale signature already exists.
          gpg --batch --yes --pinentry-mode loopback \
              --passphrase "${RELEASE_GPG_PASSPHRASE}" \
              --armor --detach-sign \
              --output checksums.txt.sig \
              checksums.txt

          # Sanity-check the signature we just produced.
          gpg --verify checksums.txt.sig checksums.txt

          echo "Signed checksums.txt -> checksums.txt.sig"

      # Pull this tag's section out of CHANGELOG.md so the GitHub release ships
      # with real notes instead of an empty body. Falls back to a minimal body
      # if no matching section is found, so a release never fails on this.
      - name: Extract release notes from CHANGELOG
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v hdr="## [${VERSION}]" '
            index($0, hdr) == 1 { f = 1; print; next }
            f && /^## \[/       { exit }
            f                   { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            printf "Release %s\n\nSee CHANGELOG.md for details.\n" "${GITHUB_REF_NAME}" > RELEASE_NOTES.md
          fi
          echo "----- release notes for ${GITHUB_REF_NAME} -----"
          cat RELEASE_NOTES.md

      - name: Create Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          files: |
            turbolang-aarch64-apple-darwin/*.tar.gz
            turbolang-x86_64-apple-darwin/*.tar.gz
            turbolang-x86_64-unknown-linux-gnu/*.tar.gz
            checksums.txt
            checksums.txt.sig
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          fail_on_unmatched_files: false

      # Push an updated Homebrew formula to the ZVN-DEV/homebrew-turbo tap.
      #
      # Requires a repository secret named HOMEBREW_TAP_TOKEN — a fine-grained
      # PAT (or GitHub App installation token) with `contents: write` on the
      # ZVN-DEV/homebrew-turbo repository. If the secret is missing the step is
      # skipped so the release itself never fails on a missing token.
      - name: Update Homebrew tap
        if: success() && steps.probe-secrets.outputs.has_tap == 'true'
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ ! -f checksums.txt ]; then
            echo "error: checksums.txt missing — Create Release step did not complete" >&2
            exit 1
          fi

          # Strip leading "v" so the formula `version` field stays semver-clean.
          VERSION="${GITHUB_REF_NAME#v}"
          TAG="${GITHUB_REF_NAME}"

          # Pull each platform's SHA256 out of the just-generated checksums.txt.
          # Anchor to the exact filename column so a future `foo.tar.gz.sig`
          # style entry can't substring-match the wrong line.
          sha_for() {
            local file="$1"
            local sha
            sha=$(awk -v f="${file}" '$2==f {print $1; exit}' checksums.txt)
            if [ -z "${sha}" ]; then
              echo "error: missing checksum for ${file} in checksums.txt" >&2
              exit 1
            fi
            echo "${sha}"
          }

          ARM64_TAR="turbolang-${TAG}-aarch64-apple-darwin.tar.gz"
          X86_64_DARWIN_TAR="turbolang-${TAG}-x86_64-apple-darwin.tar.gz"
          X86_64_LINUX_TAR="turbolang-${TAG}-x86_64-unknown-linux-gnu.tar.gz"

          ARM64_SHA=$(sha_for "${ARM64_TAR}")
          X86_64_DARWIN_SHA=$(sha_for "${X86_64_DARWIN_TAR}")
          X86_64_LINUX_SHA=$(sha_for "${X86_64_LINUX_TAR}")

          BASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"

          # Clone the tap, regenerate the formula, push back via the PAT.
          TAP_DIR="$(mktemp -d)"
          git clone --depth=1 \
            "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/ZVN-DEV/homebrew-turbo.git" \
            "${TAP_DIR}"

          mkdir -p "${TAP_DIR}/Formula"
          # The YAML `run: |` block already dedents every line by the indent
          # of the first content line, so the heredoc body below lands in the
          # bash script with `class TurboLang < Formula` as a flush-left line.
          cat > "${TAP_DIR}/Formula/turbo-lang.rb" <<EOF
          class TurboLang < Formula
            desc "Compiled, type-safe language with TypeScript DX and Rust performance"
            homepage "https://turbolang.dev"
            version "${VERSION}"
            license "MIT"

            on_macos do
              on_arm do
                url "${BASE_URL}/${ARM64_TAR}"
                sha256 "${ARM64_SHA}"
              end
              on_intel do
                url "${BASE_URL}/${X86_64_DARWIN_TAR}"
                sha256 "${X86_64_DARWIN_SHA}"
              end
            end

            on_linux do
              on_intel do
                url "${BASE_URL}/${X86_64_LINUX_TAR}"
                sha256 "${X86_64_LINUX_SHA}"
              end
            end

            def install
              bin.install "turbolang"
              bin.install "turbo-lsp"
            end

            test do
              assert_match "turbolang ${VERSION}", shell_output("#{bin}/turbolang --version")
              assert_predicate bin/"turbo-lsp", :exist?
            end
          end
          EOF

          cd "${TAP_DIR}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/turbo-lang.rb

          # Idempotent: if nothing changed (re-running the workflow), exit cleanly.
          if git diff --cached --quiet; then
            echo "Homebrew tap already up to date for ${TAG}; nothing to push."
            exit 0
          fi

          git commit -m "turbo-lang ${VERSION}"
          git push origin HEAD
