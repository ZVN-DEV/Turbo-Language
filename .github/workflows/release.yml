name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: turbo
          - os: macos-13
            target: x86_64-apple-darwin
            artifact: turbo
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: turbo

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            turbo/target
          key: ${{ runner.os }}-cargo-release-${{ matrix.target }}-${{ hashFiles('turbo/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-${{ matrix.target }}-
            ${{ runner.os }}-cargo-release-

      - name: Build
        run: |
          cd turbo
          cargo build --release --target ${{ matrix.target }}

      - name: Smoke test
        run: ./turbo/target/${{ matrix.target }}/release/turbo --version

      - name: Smoke test - compile and run
        run: |
          echo 'fn main() { print("turbo works") }' > /tmp/test.tb
          ./turbo/target/${{ matrix.target }}/release/turbo run /tmp/test.tb

      - name: Package
        run: |
          cd turbo/target/${{ matrix.target }}/release
          tar czf turbo-${{ github.ref_name }}-${{ matrix.target }}.tar.gz turbo

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: turbo-${{ matrix.target }}
          path: turbo/target/${{ matrix.target }}/release/turbo-*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4

      - name: Generate checksums
        run: |
          cd turbo-aarch64-apple-darwin && sha256sum *.tar.gz >> ../checksums.txt && cd ..
          cd turbo-x86_64-apple-darwin && sha256sum *.tar.gz >> ../checksums.txt && cd ..
          cd turbo-x86_64-unknown-linux-gnu && sha256sum *.tar.gz >> ../checksums.txt && cd ..
          echo "Generated checksums:"
          cat checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            turbo-aarch64-apple-darwin/*.tar.gz
            turbo-x86_64-apple-darwin/*.tar.gz
            turbo-x86_64-unknown-linux-gnu/*.tar.gz
            checksums.txt
          draft: false
          prerelease: false
