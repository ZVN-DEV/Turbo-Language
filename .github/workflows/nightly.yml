name: Nightly Canary

# Daily canary build that runs the full gauntlet against latest stable Rust.
# Independent of `ci.yml` (the PR-gating workflow) — this is an early warning
# system, not a merge gate, so failures here open a tracking issue instead of
# blocking PRs.

on:
  schedule:
    # 07:00 UTC daily — late evening US Pacific, morning in Europe.
    - cron: '0 7 * * *'
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gauntlet:
    name: Gauntlet (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: cargo fmt --check
        run: cargo fmt --manifest-path turbo/Cargo.toml --all -- --check

      - name: cargo clippy -D warnings
        run: cargo clippy --manifest-path turbo/Cargo.toml --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace --manifest-path turbo/Cargo.toml

      - name: Build release for integration + parity
        run: cargo build --release --workspace --manifest-path turbo/Cargo.toml

      - name: Integration tests
        run: ./tests/run_tests.sh
        working-directory: turbo

      - name: Parity tests
        run: ./tests/parity/run_parity.sh
        working-directory: turbo

      - name: cargo doc -D warnings
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --workspace --manifest-path turbo/Cargo.toml

      - uses: taiki-e/install-action@9545a0634ccdca487a09cde61d362f0bc5fb5df9 # v2.61.4
        with:
          tool: cargo-audit@0.22.1

      - name: cargo audit
        run: cargo audit --deny warnings
        working-directory: turbo

      # The following jobs exist in `ci.yml` and are mirrored here so the
      # nightly canary stays a strict superset of the PR-gating workflow.
      # If you add a new check to `ci.yml`, mirror it here too.
      #
      # Deliberate omissions from ci.yml (kept here so future maintainers
      # don't re-add them by mistake):
      #
      # * `reproducibility` (advisory soft-fail in ci.yml): nothing acts
      #   on the result either way and the job already runs on every PR
      #   with `continue-on-error: true`. Mirroring it here would add no
      #   new signal — a regression would just print another yellow X
      #   in a dashboard nobody watches. Future improvement: add it back
      #   if/when we want to track soft-fail trends across days (e.g.
      #   feed the hash diff into a cross-build observability bucket).

      - name: C runtime tests
        run: bash tests.sh
        working-directory: turbo/crates/turbo-codegen-cranelift/runtime

      - name: Lint error codes
        run: ./scripts/check_error_codes.sh

      - name: Build codegen fuzz binary
        run: cargo build --release --bin codegen-fuzz --manifest-path turbo/fuzz/Cargo.toml

      - name: Run codegen fuzz (2000 iters — nightly is not PR-latency-bound)
        run: cargo run --release --bin codegen-fuzz --manifest-path turbo/fuzz/Cargo.toml
        env:
          TURBO_FUZZ_ITERS: "2000"

  release-build:
    name: Release build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      - name: Build release binary
        run: cargo build --release --workspace --manifest-path turbo/Cargo.toml

      - name: Smoke test
        run: ./turbo/target/release/turbolang --version

  canary-publish:
    name: Publish canary
    needs: [gauntlet, release-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      - name: Build release
        run: cargo build --release --workspace --manifest-path turbo/Cargo.toml

      - name: Package canary
        run: |
          DATE=$(date -u +%Y%m%d)
          VERSION=$(grep '^version' turbo/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          CANARY_VERSION="${VERSION}-nightly.${DATE}"
          TARGET=$(rustc -vV | awk '/^host:/ {print $2}')
          TARBALL="turbolang-v${CANARY_VERSION}-${TARGET}.tar.gz"
          cp turbo/target/release/turbolang .
          tar czf "${TARBALL}" turbolang
          sha256sum "${TARBALL}" > checksums.txt
          echo "CANARY_VERSION=${CANARY_VERSION}" >> "$GITHUB_ENV"
          echo "TARBALL=${TARBALL}" >> "$GITHUB_ENV"
          echo "DATE=${DATE}" >> "$GITHUB_ENV"

      - name: Create or update nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Delete existing nightly release/tag if present
          gh release delete nightly --yes --cleanup-tag 2>/dev/null || true
          # Create new nightly pre-release
          gh release create nightly \
            --title "Nightly Build (${DATE})" \
            --notes "Automated nightly build from master @ $(git rev-parse --short HEAD).

          Version: ${CANARY_VERSION}
          Commit: $(git rev-parse HEAD)
          Date: $(date -u +%Y-%m-%d)

          **This is a pre-release build. For stable releases, use \`brew install ZVN-DEV/turbo/turbo-lang\` or the [latest release](https://github.com/ZVN-DEV/Turbo-Language/releases/latest).**" \
            --prerelease \
            "${TARBALL}" checksums.txt

  notify-on-failure:
    name: Open tracking issue on failure
    needs: [gauntlet, release-build]
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Ensure nightly-canary label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # Idempotent: succeeds whether the label already exists or not.
          gh label create nightly-canary \
            --repo "${REPO}" \
            --color "B60205" \
            --description "Auto-opened by .github/workflows/nightly.yml when the canary fails" \
            || true

      - name: Create or update canary issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y-%m-%d)
          TITLE="Nightly canary failing"
          BODY=$(printf 'The nightly canary build failed on %s.\n\nRun: %s\n\nThis issue was opened automatically by `.github/workflows/nightly.yml`.\nClose it once the underlying breakage is fixed and a fresh nightly run goes green.' "${DATE}" "${RUN_URL}")

          # Label-based dedup: any open issue tagged `nightly-canary` is
          # the canonical tracker. Comment on the most recent one if found,
          # otherwise open a new one. `--limit 100` guards against a
          # multi-week outage pushing the canonical issue off the
          # default 30-result page (extremely unlikely but free to fix).
          EXISTING=$(gh issue list --repo "${REPO}" --state open \
            --label "nightly-canary" --limit 100 \
            --json number --jq '.[0].number // empty')
          if [ -n "${EXISTING}" ]; then
            gh issue comment "${EXISTING}" --repo "${REPO}" --body "${BODY}"
          else
            gh issue create --repo "${REPO}" \
              --title "${TITLE}" \
              --body "${BODY}" \
              --label "nightly-canary"
          fi
