name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --manifest-path turbo/Cargo.toml --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          components: clippy

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            turbo/target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('turbo/Cargo.lock') }}

      - name: cargo clippy
        run: cargo clippy --manifest-path turbo/Cargo.toml --workspace --all-targets -- -D warnings

  doc:
    name: Rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            turbo/target
          key: ${{ runner.os }}-cargo-doc-${{ hashFiles('turbo/Cargo.lock') }}

      # Build all crate docs with warnings as errors. Catches broken
      # intra-doc links, invalid HTML in doc comments, and busted Rust
      # examples in doc-tests.
      - name: cargo doc
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --workspace --manifest-path turbo/Cargo.toml

  test:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            turbo/target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('turbo/Cargo.lock') }}

      - name: cargo test
        run: cargo test --workspace --manifest-path turbo/Cargo.toml

  integration:
    name: Integration tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            turbo/target
          key: ${{ runner.os }}-cargo-integration-${{ hashFiles('turbo/Cargo.lock') }}

      - name: Build release
        run: cargo build --release --workspace --manifest-path turbo/Cargo.toml

      - name: Run integration tests
        run: ./tests/run_tests.sh
        working-directory: turbo

  test-overflow:
    name: Unit tests (overflow-checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            turbo/target
          key: ${{ runner.os }}-cargo-overflow-${{ hashFiles('turbo/Cargo.lock') }}

      - name: cargo test (overflow-checks enabled)
        run: cargo test --workspace --manifest-path turbo/Cargo.toml
        env:
          RUSTFLAGS: "-C overflow-checks=on"

  build:
    name: Build (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            turbo/target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('turbo/Cargo.lock') }}

      - name: Build
        run: cargo build --release --workspace --manifest-path turbo/Cargo.toml

      - name: Report binary size
        run: |
          SIZE=$(stat --format=%s turbo/target/release/turbolang 2>/dev/null || stat -f%z turbo/target/release/turbolang)
          HUMAN=$(ls -lh turbo/target/release/turbolang | awk '{print $5}')
          echo "### Binary Size" >> "$GITHUB_STEP_SUMMARY"
          echo "| Binary | Size (bytes) | Size |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------------|------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| turbolang | ${SIZE} | ${HUMAN} |" >> "$GITHUB_STEP_SUMMARY"

  c-runtime-tests:
    name: C runtime tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Run C runtime tests
        run: bash tests.sh
        working-directory: turbo/crates/turbo-codegen-cranelift/runtime

  website:
    name: Website lint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: npm ci
        run: npm ci
        working-directory: website

      - name: npm run lint
        run: npm run lint
        working-directory: website

      - name: npm run build
        run: npm run build
        working-directory: website

      - name: npm audit (high severity gate)
        run: npm audit --audit-level=high
        working-directory: website

  playground-runner-image:
    name: Playground runner image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Build playground runner image
        run: docker build -t turbo-playground-runner:ci -f website/playground-runner/Dockerfile .

      - name: Smoke playground runner image
        run: |
          set -euo pipefail

          docker run -d --rm \
            --name turbo-playground-runner-ci \
            -p 8787:8787 \
            -e TURBO_PLAYGROUND_RUNNER_TOKEN=ci-secret \
            turbo-playground-runner:ci
          trap 'docker stop turbo-playground-runner-ci >/dev/null 2>&1 || true' EXIT

          for i in $(seq 1 30); do
            if node -e "fetch('http://127.0.0.1:8787/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"; then
              break
            fi
            if [ "$i" = "30" ]; then
              docker logs turbo-playground-runner-ci
              exit 1
            fi
            sleep 1
          done

          TURBO_PLAYGROUND_RUNNER_URL=http://127.0.0.1:8787/run \
          TURBO_PLAYGROUND_RUNNER_TOKEN=ci-secret \
          npm run smoke:playground-runner
        working-directory: website

  vscode-extension:
    name: VS Code extension smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/turbo-lang/package-lock.json

      - name: npm ci
        run: npm ci --ignore-scripts
        working-directory: editors/vscode/turbo-lang

      - name: npm audit (high severity gate)
        run: npm audit --audit-level=high
        working-directory: editors/vscode/turbo-lang

      - name: Check extension manifest and client helpers
        run: node scripts/check_vscode_extension.js

  installer-smoke:
    name: Installer smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: install.sh local release fixture
        run: bash scripts/smoke_install_script.sh

  parity:
    name: Parity tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            turbo/target
          key: ${{ runner.os }}-cargo-parity-${{ hashFiles('turbo/Cargo.lock') }}

      - name: Build release
        run: cargo build --release --workspace --manifest-path turbo/Cargo.toml

      - name: Run parity tests
        run: ./tests/parity/run_parity.sh
        working-directory: turbo

  audit:
    name: Cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # Pinned, prebuilt cargo-audit binary — a couple of seconds to install
      # and decoupled from the project lockfile so the cache doesn't bust on
      # every unrelated PR. Bump the version deliberately.
      - uses: taiki-e/install-action@9545a0634ccdca487a09cde61d362f0bc5fb5df9 # v2.61.4
        with:
          tool: cargo-audit@0.22.1

      - name: Run cargo audit
        run: cargo audit --deny warnings
        working-directory: turbo

  package-readiness:
    name: Cargo package readiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      - name: Cargo package readiness
        run: ./scripts/check_cargo_package_readiness.sh

  lint-error-codes:
    name: Lint error codes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Run check_error_codes.sh
        run: ./scripts/check_error_codes.sh

  release-consistency:
    name: Release consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Run check_release_consistency.sh
        run: ./scripts/check_release_consistency.sh

  reproducibility:
    name: Reproducibility (advisory, soft-fail)
    runs-on: ubuntu-latest
    # Cargo/rustc reproducibility is brittle even on a single runner —
    # SOURCE_DATE_EPOCH and `--remap-path-prefix` cover the obvious
    # variation but a fresh `cargo clean` rebuild can still differ on
    # debuginfo metadata. Mark soft-fail so a regression here doesn't
    # block PRs while the root cause is being investigated. The job
    # name carries `(advisory, soft-fail)` so reviewers can distinguish
    # an intentional yellow-X from a real regression.
    continue-on-error: true
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      - name: Set SOURCE_DATE_EPOCH from latest git commit
        run: |
          SDE=$(git log -1 --pretty=%ct)
          echo "SOURCE_DATE_EPOCH=${SDE}" >> "$GITHUB_ENV"
          echo "Using SOURCE_DATE_EPOCH=${SDE}"

      - name: Build #1
        env:
          # Strip debuginfo and remap absolute paths to a stable prefix
          # so the resulting binary doesn't bake in /home/runner/... or
          # the timestamp of the build host. These are the two most
          # common sources of build non-determinism.
          RUSTFLAGS: "-C debuginfo=0 --remap-path-prefix=${{ github.workspace }}=/build"
        run: |
          cargo clean --manifest-path turbo/Cargo.toml
          cargo build --release --manifest-path turbo/Cargo.toml -p turbo-cli --offline || \
            cargo build --release --manifest-path turbo/Cargo.toml -p turbo-cli
          sha256sum turbo/target/release/turbolang > hash1.txt
          cat hash1.txt

      - name: Build #2
        env:
          RUSTFLAGS: "-C debuginfo=0 --remap-path-prefix=${{ github.workspace }}=/build"
        run: |
          cargo clean --manifest-path turbo/Cargo.toml
          cargo build --release --manifest-path turbo/Cargo.toml -p turbo-cli --offline || \
            cargo build --release --manifest-path turbo/Cargo.toml -p turbo-cli
          sha256sum turbo/target/release/turbolang > hash2.txt
          cat hash2.txt

      - name: Compare hashes
        run: |
          # Compare just the hash columns; sha256sum prints a path which
          # we don't care about for byte-equality.
          h1=$(awk '{print $1}' hash1.txt)
          h2=$(awk '{print $1}' hash2.txt)
          echo "build1: ${h1}"
          echo "build2: ${h2}"
          if [ "${h1}" != "${h2}" ]; then
            echo "::warning ::turbolang binary is not bit-for-bit reproducible across two clean builds"
            diff hash1.txt hash2.txt || true
            exit 1
          fi
          echo "OK — both builds produced an identical binary"

  fuzz-smoke:
    name: Fuzz smoke (codegen)
    # Promoted from nightly-only to per-push so codegen panics are caught
    # at PR time rather than at 07:00 UTC the next day. 200 iters in
    # release mode finishes well under the 60s/target ceiling on
    # GitHub-hosted runners (~30s on ubuntu-latest). The nightly canary
    # still runs a longer 2000-iter pass for broader coverage.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      # Cargo dependency cache — stable key based on the fuzz lockfile so
      # we don't rebuild dependencies on every PR. Separate from the
      # corpus cache below so a corpus bust doesn't also throw away the
      # compiled cranelift/cargo artifacts.
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            turbo/fuzz/target
          key: ${{ runner.os }}-cargo-fuzz-${{ hashFiles('turbo/fuzz/Cargo.toml') }}

      # Fuzz corpus cache. The codegen-fuzz harness is deterministic
      # (seeded xorshift), so there is no libFuzzer-managed corpus on
      # disk today — but we reserve the cache slot under a stable name
      # so that once the harness starts persisting interesting inputs
      # to `turbo/fuzz/corpus/` (or a future libFuzzer conversion), the
      # scaffolding is already in place.
      #
      # Key includes `github.run_id` so each run writes a fresh slice;
      # `restore-keys: fuzz-corpus-` pulls the most recent predecessor
      # so corpus growth is monotonic.
      #
      # Forks from PRs do not get access to caches that could be
      # poisoned with adversarial inputs, per GitHub's cache isolation
      # rules — the `if:` below makes the skip explicit and auditable.
      - name: Cache fuzz corpus
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: turbo/fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-

      - name: Build codegen fuzz binary
        run: cargo build --release --bin codegen-fuzz --manifest-path turbo/fuzz/Cargo.toml

      # Cap the smoke run at 200 iterations, which consistently finishes
      # in ~30s on GitHub-hosted runners — well under the 60s/target
      # ceiling set for per-push fuzz jobs. The deeper 2000-iter run
      # lives in nightly.yml.
      - name: Run codegen fuzz smoke (200 iters, <60s/target)
        run: cargo run --release --bin codegen-fuzz --manifest-path turbo/fuzz/Cargo.toml
        env:
          TURBO_FUZZ_ITERS: "200"

      # Frontend fuzz smoke (lex → parse → sema). This is a separate
      # binary from codegen-fuzz with no codegen step, so it is much
      # cheaper per iteration; a small per-push count catches parser/sema
      # panics at PR time. The frontend harness takes its iteration count
      # as a positional CLI arg (not the TURBO_FUZZ_ITERS env var). The
      # deeper run lives in nightly.yml.
      - name: Build frontend fuzz binary
        run: cargo build --release --bin turbo-fuzz --manifest-path turbo/fuzz/Cargo.toml

      - name: Run frontend fuzz smoke (500 iters, fast)
        run: cargo run --release --bin turbo-fuzz --manifest-path turbo/fuzz/Cargo.toml -- 500

  c-runtime-sanitizers:
    name: C runtime sanitizers (ASAN+UBSAN)
    # Rebuild the C runtime test harness with clang's AddressSanitizer
    # and UndefinedBehaviorSanitizer so memory bugs (OOB read/write,
    # use-after-free, signed overflow, etc.) in turbo_rt.c can't slip
    # past green CI. Companion to the plain c-runtime-tests job above,
    # which uses the system `cc` with no sanitizers.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang

      # We don't call runtime/tests.sh directly because it doesn't
      # forward $CFLAGS — a tests.sh patch lives with Stream B/E.
      # Until then, we reproduce its compile invocation verbatim plus
      # the sanitizer flags. If a new tests/*.c harness lands, add it
      # to the source list below (tests.sh auto-picks them up once
      # it's patched; this job needs a manual add).
      - name: Build runtime tests with ASAN+UBSAN
        run: |
          set -euo pipefail
          cd turbo/crates/turbo-codegen-cranelift/runtime
          mkdir -p "$RUNNER_TEMP/rt"
          clang \
            -std=c11 \
            -Wall -Wextra \
            -Wno-unused-function -Wno-unused-parameter \
            -DRT_TEST_BUILD \
            -fsanitize=address,undefined \
            -fno-omit-frame-pointer \
            -O1 -g \
            -o "$RUNNER_TEMP/rt/test_rt" \
            tests/test_rt.c \
            turbo_rt.c \
            -lpthread -lm

      - name: Run runtime tests under ASAN+UBSAN
        env:
          # Abort on any real memory-safety violation (out-of-bounds,
          # use-after-free, double-free) or UB (signed overflow, misaligned
          # access, integer-cast-truncation). Leak detection is disabled:
          # the test harness is a short-lived main() and several
          # negative-path tests intentionally skip freeing the empty/NULL
          # return of rt_http_* and rt_str_repeat -- those are
          # process-lifetime leaks, not runtime bugs. The goal of this job
          # is to catch UB and memory-safety bugs, which ASAN+UBSAN still
          # cover with detect_leaks=0.
          ASAN_OPTIONS: "detect_leaks=0:abort_on_error=1:halt_on_error=1"
          UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"
        run: "$RUNNER_TEMP/rt/test_rt"
