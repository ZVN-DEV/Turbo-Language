[package]
name = "turbo-notes"
version = "0.1.0"
edition = "2026"
description = "Native desktop markdown editor with AI-powered writing assistance"
license = "MIT"

[dependencies]
turbo-fs = "0.1"       # File system operations, watchers, paths

[dev-dependencies]
turbo-test-utils = "0.1"

[build]
target = "native"
opt-level = "release"

[agent]
default-model = "claude-sonnet"

[window]
title = "TurboNotes"
width = 1280
height = 800
min-width = 640
min-height = 480
resizable = true
decorations = true

[window.menu]
enabled = true
items = [
  { label = "File",   shortcuts = ["Ctrl+N", "Ctrl+O", "Ctrl+S", "Ctrl+Shift+S"] },
  { label = "Edit",   shortcuts = ["Ctrl+Z", "Ctrl+Shift+Z", "Ctrl+X", "Ctrl+C", "Ctrl+V"] },
  { label = "View",   shortcuts = ["Ctrl+P", "Ctrl+Shift+F"] },
  { label = "AI",     shortcuts = ["Ctrl+Shift+A"] },
  { label = "Export", shortcuts = ["Ctrl+E", "Ctrl+Shift+E"] },
]

[autosave]
enabled = true
interval-ms = 3000
debounce-ms = 500

[search]
max-results = 100
snippet-length = 120

[export]
html-template = "default"
pdf-engine = "native"
