# Fly.io app config for the Turbo example service.
# Deploy: fly launch --copy-config --name <your-app-name> --now
# (or: fly deploy, once the app exists)

app = "turbo-hello"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  method = "GET"
  path = "/healthz"
  interval = "15s"
  timeout = "2s"
  grace_period = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
